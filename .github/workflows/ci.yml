name: CI

on:
  push:

permissions:
  id-token: write
  # go-toolchain's dependency-graph submission needs this to POST its snapshot.
  contents: write
  # go-toolchain's no-all-builds guard scans check runs via these two.
  actions: read
  checks: read
  # Required by both publish paths here (go-toolchain's release upload in build, buildhost-publish-site in preview); each fails the job without it.
  artifact-metadata: write
  deployments: write
  # Required by the publish-ghcr reusable workflow, which cannot exceed the caller's declared permissions.
  packages: write

jobs:
  sqlc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlc
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.28.0/sqlc_1.28.0_linux_amd64.tar.gz | tar xz
          sudo mv sqlc /usr/local/bin/
      - name: Check sqlc generated code is up to date
        run: |
          sqlc generate
          if [ -n "$(git diff -- internal/database/dbgen/)" ]; then
            echo "::error::sqlc generated code is out of date. Run 'sqlc generate' and commit the changes."
            git diff -- internal/database/dbgen/
            exit 1
          fi

  # Type-check gate for the dashboard's only source (internal/api/web/src/*.ts); also enforces that no generated JS is committed.
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Type-checks testdata/ harnesses against the dashboard source, so a signature change fails here, not at runtime. Emits nothing (node runs the .ts directly).
      - run: npm run check:harness
      - name: Verify no generated dashboard JS is committed
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Ask git what is TRACKED (not what is on disk) — the build step above just wrote the ignored .js files into the working tree.
            const res = await exec.getExecOutput(
              "git", ["ls-files", "--", "internal/api/web/assets/*.js"], { silent: true });
            const tracked = res.stdout.split("\n").map((l) => l.trim()).filter(Boolean);
            if (tracked.length > 0) {
              core.info(tracked.join("\n"));
              core.setFailed(
                "Generated dashboard JS is committed. The TypeScript in " +
                "internal/api/web/src/ is the only source; CI builds the JS. " +
                "Run `git rm --cached internal/api/web/assets/*.js` and commit.");
            } else {
              core.info("No generated JS is tracked — TypeScript is the only committed source.");
            }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compiles the TypeScript before the Go build: dashboard.go's //go:embed line names each assets/*.js file directly, so a missing one is a compile error.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # go-toolchain@v1 itself cache-uploads build/ as go-build on every run (a once-per-run key); do not add a separate cache-upload step, it collides.
      - uses: wow-look-at-my/go-toolchain@v1

  # Starts the built image and requires it to serve; docker/imagecheck.test.ts holds the assertions, reproducible locally with `npm run test:image`.
  image-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # path: build matches publish-ghcr; the hand-off holds the binaries themselves, so restoring to the workspace root leaves the Dockerfile's COPY empty.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      - run: npm ci
      - run: npm run test:image

  # Builds and pushes the image to GHCR on master, restoring build's go-build hand-off for the Dockerfile; prunes old versions. Gated on image-smoke.
  publish-ghcr:
    needs: [build, image-smoke]
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master

  # Deploys a backend-free styling preview (canned demo-data.js) to buildhost as a per-branch static site; OIDC handles auth, no static token needed.
  preview:
    needs: web-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Assemble the demo bundle
        id: bundle
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const webDir = "internal/api/web";
            const dist = "dist";
            fs.mkdirSync(`${dist}/assets`, { recursive: true });

            // Inject the preview-only demo-data.js before app.js so the page renders canned data instead of calling the (absent) backend.
            const appTag = '<script type="module" src="assets/app.js"></script>';
            const demoTag = '<script type="module" src="assets/demo-data.js"></script>';
            let html = fs.readFileSync(`${webDir}/index.html`, "utf8");
            html = html.replace(appTag, `${demoTag}\n    ${appTag}`);
            fs.writeFileSync(`${dist}/index.html`, html);

            for (const f of ["app.js", "rate-meter.js", "timeline.js", "style.css", "demo-data.js"]) {
              fs.copyFileSync(`${webDir}/assets/${f}`, `${dist}/assets/${f}`);
            }

            // buildhost serves sites under a single path segment, so the branch name must not contain '/': flatten anything outside [A-Za-z0-9._-].
            const raw = github.ref_name || "preview";
            const branch = raw.replace(/[^A-Za-z0-9._-]/g, "-");
            core.setOutput("branch", branch);
            core.info(`Prepared dist/ for branch '${branch}'.`);
      - name: Publish preview to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: https://pazer.build
          project: github-state-mirror
          branch: ${{ steps.bundle.outputs.branch }}
          source_dir: ./dist
