name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# See docs/ci.md for why each grant below is required.
permissions:
  id-token: write

  contents: write
  actions: read
  checks: read

  artifact-metadata: write
  deployments: write
  pull-requests: write

  packages: write

jobs:
  # See docs/ci.md for why this job exists and what it enforces.
  web-check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just build

      - run: just check-harness
      - name: Verify no generated dashboard JS is committed
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Ask git what is TRACKED (not what is on disk) — the build step above just wrote the ignored .js files into the working tree.
            const res = await exec.getExecOutput(
              "git", ["ls-files", "--", "internal/api/web/assets/*.js"], { silent: true });
            const tracked = res.stdout.split("\n").map((l) => l.trim()).filter(Boolean);
            if (tracked.length > 0) {
              core.info(tracked.join("\n"));
              core.setFailed(
                "Generated dashboard JS is committed. The TypeScript in " +
                "internal/api/web/src/ is the only source; CI builds the JS. " +
                "Run `git rm --cached internal/api/web/assets/*.js` and commit.");
            } else {
              core.info("No generated JS is tracked — TypeScript is the only committed source.");
            }

  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # See docs/ci.md: the dashboard JS must compile before the Go build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just build
      # See docs/ci.md: do not add an explicit cache-upload step here.
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          # darwin/arm64 dropped pending an upstream go-toolchain fix; see docs/COSMO-PLATFORMS.md.
          cosmo-platforms: linux/amd64,windows/amd64

  # See docs/ci.md: this job starts the image and requires it to serve.
  image-smoke:
    needs: build
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      # See docs/ci.md: path must match what publish-ghcr passes.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      - run: npm ci
      - run: just test-image

  # See docs/ci.md: pushes ghcr.io/wow-look-at-my/github-state-mirror:latest.
  publish-ghcr:
    needs: [build, image-smoke]
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@lkgb

  # See docs/ci.md: deploys a backend-free styling preview per branch.
  preview:
    needs: web-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just build
      - name: Assemble the demo bundle
        id: bundle
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const webDir = "internal/api/web";
            const dist = "dist";
            fs.mkdirSync(`${dist}/assets`, { recursive: true });

            // Inject the preview-only demo-data.js before app.js so the page renders canned data instead of calling the (absent) backend.
            const appTag = '<script type="module" src="assets/app.js"></script>';
            const demoTag = '<script type="module" src="assets/demo-data.js"></script>';
            let html = fs.readFileSync(`${webDir}/index.html`, "utf8");
            html = html.replace(appTag, `${demoTag}\n    ${appTag}`);
            fs.writeFileSync(`${dist}/index.html`, html);

            for (const f of ["app.js", "rate-meter.js", "timeline.js", "style.css", "demo-data.js"]) {
              fs.copyFileSync(`${webDir}/assets/${f}`, `${dist}/assets/${f}`);
            }

            // buildhost serves sites under a single path segment, so the branch name must not contain '/': flatten anything outside [A-Za-z0-9._-].
            const raw = github.ref_name || "preview";
            const branch = raw.replace(/[^A-Za-z0-9._-]/g, "-");
            core.setOutput("branch", branch);
            core.info(`Prepared dist/ for branch '${branch}'.`);
      - name: Publish preview to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@lkgb
        with:
          server: https://pazer.build
          project: github-state-mirror
          branch: ${{ steps.bundle.outputs.branch }}
          source_dir: ./dist
